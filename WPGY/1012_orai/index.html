<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KERITUBE</title>
    <link rel="stylesheet" href="Forrás/gyakorló feladat/style.css">
</head>
<body>
    <header>
        <h1>KERITUBE</h1>

        <nav>
            <a href="#fooldal">Főoldal</a>
            <a href="#videok">Videók</a>
            <a href="#kapcsolat">Kapcsolat</a>
        </nav>
    </header>

    <main id="fooldal">
        <section class="bemutato">
            <h2>Üdvözlónk a KERITUBE videólejátszó oldalán</h2>
            <p>Nézd meg kedvenc videóidat korlátlanul</p>
        </section>

        <section id="videok">
            <h2>Napi videó ajánló</h2>

            <article class="video-kartya">
                <video controls poster="Forrás/gyakorló feladat/Dzsudlo.jpg">
                    <source src="Forrás/gyakorló feladat/Dzsúdló - SÖTÉT (Official Music Video) - DZSÚDLÓ (1080p).mp4" type="video/mp4">
                    A böngésződ nem támogatja a videót
                </video>
                <h3>Dzsudló Sötét</h3>
                    <p>
                        Dzsudló egyik leghíresebb zenéje.
                    </p>
            </article>
        </section>

        <aside>
            <h2>Ajánlott videók</h2>
            <div class="ajanlasok">
                <article class="ajanlas">
                    <h3>Előbb megtekintett videó</h3>
                    <p>D4vd - Remember Me</p>
                    <video controls poster="Forrás/gyakorló feladat/d4vd.jpg">
                    <source src="Forrás/gyakorló feladat/Remember Me - D4vd (full version) - Badash (1080p).mp4">
                    A böngésződ nem támogatja a videót
                    </video>
                </article>
        <aside>
            <div class="ajanlasok">
                <article class="ajanlas">
                    <h3>Következő videó</h3>
                    <p>Mehringer, sosehol ÉDEN</p>
                    <video controls poster="Forrás/gyakorló feladat/mehringer.jpg">
                    <source src="Forrás/gyakorló feladat/Mehringer, sosehol - ÉDEN - Mehringer (1080p).mp4">
                    A böngésződ nem támogatja a videót
                    </video>
                </article>
            </div>
        </aside>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="IGB">
    <link rel="stylesheet" href="style.css">
    <!-- utalom ezt a szakmat -->
    <title>Házi feladat</title>
</head>
<body>
    <h1>Konzolban futó feladatok</h1>
    <button class="gomb" id="feladat1">1.feladat</button>
    <button class="gomb" id="feladat2">2.feladat</button>
    <button class="gomb" id="feladat3">3.feladat</button>
    <button class="gomb" id="feladat4">4.feladat</button>
    <button class="gomb" id="feladat5">5.feladat</button>
    <button class="gomb" id="feladat6">6.feladat</button>
    <h1>HTML-ben is megjelenő feladatok</h1>
    <div id="uzenet">
        <button class="gomb" id="feladat7">7.feladat</button>
        <p id="uzenet2">Ez az üzenet bizony megváltozott</p>
    </div>
    <h2>8.feladat</h2>
    <button class="gomb" id="feladat8">8.Feladat</button>
    <ul id="lista"></ul>
    <h2>9.feladat</h2>
    <input type="text" id="kereso" placeholder="Keress a nevek között!">
    <ul id="talalatok"></ul>
    <script src="script.js" defer></script>
    <button id="tema">10.feladat(téma váltása)</button>
</body>
</html>
